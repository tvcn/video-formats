  <script>
  (function(){
    var index=[{"id":"product-ad","title":"产品广告：三秒抓人，十秒讲清","summary":"产品广告不是产品展示片。前三秒给问题，中段给一个卖点，结尾给一个动作。","site":"formats","url":"/article/product-ad/"},{"id":"documentary","title":"纪录短片：拍到一个变化","summary":"先找到一个人，再等一件事发生。片子成立，往往是因为开机前后他变了点什么。","site":"formats","url":"/article/documentary/"},{"id":"brand-film","title":"品牌片：先让人相信一句话","summary":"品牌片不解释参数，它让观众记住一个态度。产品只是证据，不是主角。","site":"formats","url":"/article/brand-film/"},{"id":"thumbnail","title":"封面缩到 200 像素，还认得出吗","summary":"手机上的封面只有拇指大。先保证一张脸、一个动作、一个对比，再谈字。","site":"formats","url":"/article/thumbnail/"},{"id":"vertical-drama","title":"竖屏短剧：前三秒先让人物要东西","summary":"竖屏没有时间铺世界。第一屏让人物想要一个东西，第三秒让观众知道谁挡着，最后留一个没答的问题。","site":"formats","url":"/article/vertical-drama/"},{"id":"talking-head","title":"口播：写给耳朵，不是写给眼睛","summary":"口播不是把文章念出来。观众听不见标点，只听得见意思。句子要短，转折要早，例子要具体；一口气说不完，就分成两句。","site":"formats","url":"/article/talking-head/"},{"id":"vlog-structure","title":"旅拍 Vlog 结构：先给一个地方的理由","summary":"旅拍 Vlog 先给一个去这里的理由，再拍好看；没有理由，风景只是屏保。","site":"formats","url":"/article/vlog-structure/"},{"id":"music-video-structure","title":"MV 结构：歌是时间轴","summary":"MV 结构跟歌走：主歌给空间，副歌给记忆点，桥段给转折。","site":"formats","url":"/article/music-video-structure/"},{"id":"wedding-structure","title":"婚礼片结构：先保仪式，再谈风格","summary":"婚礼片先保仪式和誓言，再谈慢动作和调色；仪式没拍到，风格救不回来。","site":"formats","url":"/article/wedding-structure/"},{"id":"talking-head-breakdown","title":"口播拉片：60 秒怎么留住人","summary":"按 60 秒口播的通用结构，拆 8 个时间码：结论、原因、例子一、例子二、反方、证据、应用、问题。","site":"formats","url":"/article/talking-head-breakdown/"},{"id":"talking-head-template","title":"口播模板：一句话、三个例子、一个动作","summary":"口播模板一句话主张、三个例子、一个动作；例子必须能被镜头看见。","site":"formats","url":"/article/talking-head-template/"},{"id":"product-ad-breakdown","title":"产品广告拉片：问题怎么变成证据","summary":"按 60 秒产品广告的通用结构，拆 9 个时间码：问题、失败、产品、演示、证据、异议、第二证据、结果、行动。","site":"formats","url":"/article/product-ad-breakdown/"},{"id":"product-ad-template","title":"产品广告模板：三秒问题、十秒证明","summary":"产品广告模板前三秒给问题，十秒给证明，最后五秒给一个动作。","site":"formats","url":"/article/product-ad-template/"},{"id":"documentary-breakdown","title":"纪录短片拉片：一个人、一件事、一个变化","summary":"按 3 分钟纪录短片的通用结构，拆 8 个时间码：动作、人物、欲望、阻碍、尝试、代价、变化、之后。","site":"formats","url":"/article/documentary-breakdown/"},{"id":"documentary-template","title":"纪录模板：一个人、一件事、一个变化","summary":"纪录模板一个人、一件具体的事、一个能看见的变化；不要从时代开始讲。","site":"formats","url":"/article/documentary-template/"},{"id":"brand-film-breakdown","title":"品牌片拉片：90 秒怎么建立世界","summary":"按 90 秒品牌片的通用结构，拆 9 个时间码：世界、人物、欲望、阻碍、转向、行动、落点、一句话、停留。","site":"formats","url":"/article/brand-film-breakdown/"},{"id":"brand-film-template","title":"品牌片模板：主张、证据、落点","summary":"品牌片模板立场、证据、落点；立场要能被反对，证据要具体。","site":"formats","url":"/article/brand-film-template/"},{"id":"short-drama-breakdown","title":"短剧拉片：30 秒一个反转","summary":"按 30 秒短剧的通用结构，拆 8 个时间码：画面钩子、结论、设定、升级、假答案、真线索、反转、反应。","site":"formats","url":"/article/short-drama-breakdown/"},{"id":"short-drama-template","title":"短剧模板：30 秒一个钩子","summary":"短剧模板每三十秒一个钩子：新信息、新阻碍、新代价。","site":"formats","url":"/article/short-drama-template/"},{"id":"vlog-breakdown","title":"Vlog 拉片：90 秒一个发现","summary":"按 90 秒旅拍 Vlog 的通用结构，拆 8 个时间码：动作、地点、任务、阻碍、失败、发现、安静、离开。","site":"formats","url":"/article/vlog-breakdown/"},{"id":"vlog-template","title":"Vlog 模板：出发、遇到、改变","summary":"Vlog 模板出发、遇到、改变；改变可以很小，但必须发生。","site":"formats","url":"/article/vlog-template/"},{"id":"news-structure","title":"新闻结构：先给现场，再给核实","summary":"新闻结构先给现场，再给核实；先讲背景，观众已经走了。","site":"formats","url":"/article/news-structure/"},{"id":"news-breakdown","title":"新闻拉片：90 秒怎么把未知留在片里","summary":"按 90 秒新闻短片的通用结构，拆 8 个时间码：已核实事实、现场、目击者、资料、背景、已知/未知、未解、下一步。","site":"formats","url":"/article/news-breakdown/"},{"id":"news-template","title":"新闻模板：现场、背景、影响","summary":"新闻模板现场、背景、影响；每一段都要回答一个观众的问题。","site":"formats","url":"/article/news-template/"},{"id":"tutorial-structure","title":"教程结构：一个问题只教一件事","summary":"教程结构一个问题只教一件事；塞进三个技巧，观众一个也学不会。","site":"formats","url":"/article/tutorial-structure/"},{"id":"tutorial-breakdown","title":"教程拉片：5 分钟怎么让人学会","summary":"按 5 分钟教程的通用结构，拆 10 个时间码：结果、材料、三步、检查、失败、复盘、下一步、行动。","site":"formats","url":"/article/tutorial-breakdown/"},{"id":"tutorial-template","title":"教程模板：目标、步骤、验收","summary":"教程模板目标、步骤、验收；每一步都要有可观察的结果。","site":"formats","url":"/article/tutorial-template/"},{"id":"music-video-breakdown","title":"MV 拉片：歌的结构怎么变成画面","summary":"按 3 分半 MV 的通用结构，拆 9 个时间码：前奏母题、主歌、预副歌、副歌、主歌二、桥段、副歌二、尾奏、停留。","site":"formats","url":"/article/music-video-breakdown/"},{"id":"music-video-template","title":"MV 模板：主歌、副歌、记忆点","summary":"MV 模板主歌、副歌、记忆点；记忆点可以是一个动作或一个画面。","site":"formats","url":"/article/music-video-template/"},{"id":"wedding-breakdown","title":"婚礼拉片：6 分钟怎么不拍成流程","summary":"按 6 分钟婚礼片的通用结构，拆 11 个时间码：准备、到场、仪式、誓言、戒指、家人、宴会、舞会、安静、肖像、离开。","site":"formats","url":"/article/wedding-breakdown/"},{"id":"wedding-template","title":"婚礼模板：开场、仪式、祝福","summary":"婚礼模板开场、仪式、祝福；开场给一天的感觉，不是给婚纱特写。","site":"formats","url":"/article/wedding-template/"},{"id":"event-structure","title":"活动片结构：先给结果，再给过程","summary":"活动片先给结果，再给过程；观众要知道这场活动成了什么。","site":"formats","url":"/article/event-structure/"},{"id":"event-breakdown","title":"活动片拉片：90 秒怎么讲清现场","summary":"按 90 秒活动片的通用结构，拆 8 个时间码：到场、规模、关键瞬间、细节、人、高潮、之后、落版。","site":"formats","url":"/article/event-breakdown/"},{"id":"event-template","title":"活动片模板：开场、现场、收束","summary":"活动片模板开场、现场、收束；现场段落要有环境声，不要全铺音乐。","site":"formats","url":"/article/event-template/"},{"id":"interview-structure","title":"访谈结构：问题比机位重要","summary":"访谈结构里问题比机位重要；问题太空，回答只能空。","site":"formats","url":"/article/interview-structure/"},{"id":"interview-breakdown","title":"采访拉片：3 分钟怎么让人物成立","summary":"按 3 分钟采访片的通用结构，拆 9 个时间码：答案钩子、人物在工作、问题一、证据、问题二、转向、语境、收束、停留。","site":"formats","url":"/article/interview-breakdown/"},{"id":"interview-template","title":"访谈模板：人物、问题、场景","summary":"访谈模板人物、问题、场景；先拍他能做事的地方，再坐下来讲。","site":"formats","url":"/article/interview-template/"},{"id":"experimental-structure","title":"实验影像结构：规则先于效果","summary":"实验影像先立规则：固定机位、重复动作、单一颜色；规则越清楚，效果越强。","site":"formats","url":"/article/experimental-structure/"},{"id":"experimental-breakdown","title":"实验影像拉片：规则、重复、打破","summary":"按 4 分钟实验片的通用结构，拆 8 个时间码：前规则、规则、重复三次、打破、后果、停止。","site":"formats","url":"/article/experimental-breakdown/"},{"id":"corporate-video-structure","title":"企业宣传结构：六个拍点","summary":"企业宣传不是公司简介视频。先写一个观众愿意看完的问题，再用一个人、一个动作证明公司解决了它。","site":"formats","url":"/article/corporate-video-structure/"},{"id":"corporate-video-breakdown","title":"企业宣传拉片：六个段落怎么落地","summary":"综合样例：把企业宣传拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/corporate-video-breakdown/"},{"id":"corporate-video-template","title":"企业宣传模板：一张表拍完","summary":"企业宣传一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/corporate-video-template/"},{"id":"sports-video-structure","title":"运动短片结构：六个拍点","summary":"运动短片不是慢动作集锦。先定一个动作目标：赢、复出、还是接受失败；让身体承担叙事，不靠旁白解释。","site":"formats","url":"/article/sports-video-structure/"},{"id":"sports-video-breakdown","title":"运动短片拉片：六个段落怎么落地","summary":"综合样例：把运动短片拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/sports-video-breakdown/"},{"id":"sports-video-template","title":"运动短片模板：一张表拍完","summary":"运动短片一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/sports-video-template/"},{"id":"food-video-structure","title":"美食桌面结构：六个拍点","summary":"美食片不是旋转托盘。先拍“变化”：生到熟、冷到热、整到碎；声音是第二主菜，手比嘴更有说服力。","site":"formats","url":"/article/food-video-structure/"},{"id":"food-video-breakdown","title":"美食桌面拉片：六个段落怎么落地","summary":"综合样例：把美食桌面拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/food-video-breakdown/"},{"id":"food-video-template","title":"美食桌面模板：一张表拍完","summary":"美食桌面一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/food-video-template/"},{"id":"real-estate-video-structure","title":"房产空间结构：六个拍点","summary":"房产片不是广角扫楼。先给“谁住进来”的生活问题，再用空间证明；每个镜头回答一个居住问题。","site":"formats","url":"/article/real-estate-video-structure/"},{"id":"real-estate-video-breakdown","title":"房产空间拉片：六个段落怎么落地","summary":"综合样例：把房产空间拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/real-estate-video-breakdown/"},{"id":"real-estate-video-template","title":"房产空间模板：一张表拍完","summary":"房产空间一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/real-estate-video-template/"},{"id":"fashion-beauty-video-structure","title":"时尚美妆结构：六个拍点","summary":"时尚美妆不是模特走秀。先定“质感”：布料、皮肤、光；用近景和动作证明，不靠滤镜磨皮。","site":"formats","url":"/article/fashion-beauty-video-structure/"},{"id":"fashion-beauty-video-breakdown","title":"时尚美妆拉片：六个段落怎么落地","summary":"综合样例：把时尚美妆拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/fashion-beauty-video-breakdown/"},{"id":"fashion-beauty-video-template","title":"时尚美妆模板：一张表拍完","summary":"时尚美妆一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/fashion-beauty-video-template/"},{"id":"live-podcast-structure","title":"直播播客结构：六个拍点","summary":"直播/播客不是把长视频放上来。先设计“可截断的单元”，每 3–5 分钟一个完整问题，观众随时进来都懂。","site":"formats","url":"/article/live-podcast-structure/"},{"id":"live-podcast-breakdown","title":"直播播客拉片：六个段落怎么落地","summary":"综合样例：把直播播客拆成六拍，逐段看画面、声音和通过线；示例数字只作示范，不是客户数据。","site":"formats","url":"/article/live-podcast-breakdown/"},{"id":"live-podcast-template","title":"直播播客模板：一张表拍完","summary":"直播播客一张表：六拍、画面、声音、时长与通过线；开机前填完，现场只认这张表。","site":"formats","url":"/article/live-podcast-template/"},{"id":"deep-short-drama","title":"短剧：模板、拆解、剧本","summary":"短剧不是把长片剪短；模板、拆解和剧本要围绕一个 30 秒钩子重新排。","site":"formats","url":"/article/deep-short-drama/"},{"id":"deep-brand-film","title":"品牌片：模板、拆解、企业结构","summary":"品牌片不是企业简介；一个卖点、一个人物和一个可记住的动作比十个部门更重要。","site":"formats","url":"/article/deep-brand-film/"},{"id":"deep-documentary","title":"纪录片：模板、拆解、伦理","summary":"纪录片不是把真实拍下来；模板、拆解和伦理决定你保留了谁的声音。","site":"formats","url":"/article/deep-documentary/"},{"id":"deep-music-video","title":"MV：模板、结构、拆解","summary":"MV 不是把歌配画面；结构、表演和剪辑点要跟着音乐走，而不是跟着台词走。","site":"formats","url":"/article/deep-music-video/"},{"id":"deep-food-tabletop","title":"美食桌面：模板、结构、拆解","summary":"美食片不是食物特写合集；桌面、声音和 30 秒动作顺序决定它好不好吃。","site":"formats","url":"/article/deep-food-tabletop/"},{"id":"deep-course-video","title":"课程视频：让观众学会，而不是看完","summary":"课程片不是把知识念完，是设计一次能力变化；目标可做、练习可做、验收可做，才算教会。","site":"formats","url":"/article/deep-course-video/"},{"id":"deep-real-estate-video","title":"房产空间：把户型拍成动线","summary":"房产片不是扫房间，是让人看见一条生活动线：从进门到坐下，空间怎么被使用。","site":"formats","url":"/article/deep-real-estate-video/"}];

    var input=document.getElementById('staticSearchInput');

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
    function syncQuery(){
      var params=new URLSearchParams(location.search);
      var value=input.value.trim();
      if(value) params.set('q',value); else params.delete('q');
      var query=params.toString();
      try{history.replaceState(null,'',location.pathname+(query?'?'+query:''))}catch(e){}
    }
    function render(){
      var q=input.value.trim().toLowerCase();
      if(defaultBox) defaultBox.style.display=q?'none':'';

      if(!hits.length){out.innerHTML='<div class="empty"><p class="search-hint">没有匹配的文章。</p></div>';return}

    }
    function update(){render();syncQuery()}
